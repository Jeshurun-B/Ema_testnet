# ====================================================================================================
# ALGORITHM: .github/workflows/runner.yml — Autonomous 5.5-Hour Self-Chaining Production Daemon
# ====================================================================================================
# Purpose:
#   Run the autonomous trading daemon on GitHub Actions 24/7. Completely purges the broken Cloudflare
#   WARP tunnel (which resolved to US IPs), exposes the non-US forward proxy secret (BINANCE_PROXY_URL),
#   installs pinned dependencies (including pysocks), and executes main.py with unbuffered line output.
#
# Algorithm Steps:
#   Step 1: Define Workflow Triggers (manual dispatch, 6-hour cron backup, and concurrency control).
#   Step 2: Checkout Repository source code via actions/checkout@v4.
#   Step 3: Setup Python 3.12 Runtime via actions/setup-python@v5.
#   Step 4: Install Dependencies from requirements.txt (including pysocks for SOCKS5/HTTP proxy support).
#   Step 5: Execute Autonomous Trading Daemon with full environment injection (BINANCE_PROXY_URL, API keys, Supabase).
# ====================================================================================================

name: EMA Testnet Production Daemon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: binance-testnet-worker
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # Step 2: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 3: Set up Python 3.12 Runtime
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 4: Install Production Dependencies (includes pysocks)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run 5.5-Hour Self-Chaining Trading Engine with Proxy Tunnel
      - name: Run 5.5-Hour Self-Chaining Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          BINANCE_PROXY_URL: ${{ secrets.BINANCE_PROXY_URL }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u main.py
