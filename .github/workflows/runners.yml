# ====================================================================================================
# ALGORITHM: .github/workflows/runners.yml — Production Daemon with 350m Cap & Pip Caching
# ====================================================================================================
# Purpose:
#   Continuous cloud production orchestrator for the EMA-testnet Pure Market FSM desk.
#   Executes `main.py` in an isolated GitHub Actions Ubuntu container, tunnels traffic through the
#   Frankfurt proxy tunnel, enforces a hard 350-minute job timeout, leverages pip caching for sub-10s
#   dependency installation, and authorizes self-chaining successor dispatches via GH_PAT.
#
# Algorithm Steps:
#   Step 1: Workflow Triggers:
#           - Manual execution via `workflow_dispatch`.
#           - Emergency 8-hour dead-man's watchdog schedule (`0 */8 * * *`) to auto-revive if self-chaining fails.
#   Step 2: Concurrency Lock (`binance-testnet-worker`):
#           - Enforces strictly 1 active trading worker per repository (`cancel-in-progress: false`).
#   Step 3: Job Configuration & Timeout Guard:
#           - Runs on ubuntu-latest with `timeout-minutes: 350` to backstop the 320-minute software handover.
#           - Grants `actions: write` and `contents: write` permissions for GH_PAT workflow dispatch.
#   Step 4: Repository Checkout & Python 3.12 Setup:
#           - Checks out `main` branch via actions/checkout@v4.
#           - Configures Python 3.12 with pip caching (`cache: 'pip'`) to slash startup overhead.
#   Step 5: Production Dependency Ingestion:
#           - Installs pinned requirements (CatBoost, PyTorch, CCXT, Supabase, TA).
#   Step 6: Master Daemon Launch:
#           - Injects GH_PAT, proxy URL, Binance API keys, and Supabase credentials.
#           - Launches `main.py` with output unbuffering (`python -u`).
# ====================================================================================================

name: EMA Testnet Production Daemon

off:
  workflow_dispatch:
  schedule:
    # 8-Hour emergency watchdog (Resurrects bot only if self-chaining fails; avoids 40m queue collisions)
    - cron: '0 */8 * * *'

concurrency:
  group: binance-testnet-worker
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      # Step 4: Repository Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 4: Setup Python 3.12 Runtime with Pip Wheel Caching
      - name: Set up Python 3.12 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 5: Install Production Dependencies (Cached)
      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 6: Launch Master Orchestrator Daemon
      - name: Run 5.5-Hour Self-Chaining Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
          BINANCE_PROXY_URL: ${{ secrets.BINANCE_PROXY_URL }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u main.py
