name: EMA Testnet Production Daemon

on:
  # 1. Primary Trigger: Self-chaining dispatch via GitHub REST API
  workflow_dispatch:
  
  # 2. Safety Net: Backup cron every 6 hours in case GitHub network terminates a job
  schedule:
    - cron: '0 */6 * * *'

# Concurrency Guard: Guarantees ONLY ONE worker runs at any time (prevents duplicate orders)
concurrency:
  group: binance-testnet-worker
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Mandatory for self-triggering the next worker job via API

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy torch catboost ta supabase requests

      - name: Run 5.5-Hour Self-Chaining Trading Engine
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py
