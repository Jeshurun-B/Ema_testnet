# ====================================================================================================
# ALGORITHM: .github/workflows/runner.yml — 5.5-Hour Daemon with Cloudflare WARP Bypass
# ====================================================================================================
# Purpose:
#   Run the autonomous 5.5-hour trading daemon on GitHub Actions while bypassing Binance's US
#   geo-blocking (HTTP 451). Routes outbound API traffic through Cloudflare WARP so the runner
#   can freely query `demo-fapi.binance.com` for market data and order execution.
#
# Key Architectural Fix:
#   - Step 3 (Setup Cloudflare WARP): Installs and establishes an Anycast WARP tunnel on the runner
#     before Python starts. Bypasses Azure US data center IP blocks on Binance.
#
# Workflow Steps:
#   Step 1: Declare workflow metadata, triggers (workflow_dispatch + backup cron), and concurrency lock.
#   Step 2: Assign runner image (ubuntu-latest) and write permissions for self-chaining.
#   Step 3: Checkout repository source code.
#   Step 4: Establish Cloudflare WARP tunnel (fscarmen/warp-on-actions@v1.4) to bypass HTTP 451.
#   Step 5: Set up Python 3.12 runtime environment.
#   Step 6: Install dependencies from requirements.txt.
#   Step 7: Launch unbuffered 5.5-hour autonomous daemon (python -u main.py).
# ====================================================================================================

name: EMA Testnet Production Daemon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: binance-testnet-worker
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── STEP 4: Establish Cloudflare WARP Tunnel (Bypasses Binance HTTP 451 Block) ──
      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5.5-Hour Self-Chaining Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -u main.py
